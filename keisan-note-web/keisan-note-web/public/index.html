    ${S.reportError ? `<div class="notice"><p style="margin:0">日本語の説明を作れませんでした（${esc(S.reportError)}）。訳がない誤概念は英語名、声かけは定型文で表示しています。</p>
      <div class="row" style="margin-top:8px"><button class="btn" id="retryja" type="button">日本語の説明を作り直す</button></div></div>` : ""}
    ${top.length ? `<div class="card"><h3>つまずきの単元</h3><div class="tags">${top.map(([c, n]) => `<span>${esc(c)}（${n}問）</span>`).join("")}</div></div>` : ""}
    ${S.rep.map(r => `<div class="card"><h3>${esc(qName(r))}　${esc(r.problem || (r.question.length > 60 ? r.question.slice(0, 60) + "…" : r.question))}</h3>
      <div>原因：<b>${esc(r.type)}</b>${r.concepts[0] ? `（${esc(r.concepts[0])}）` : ""}</div>
      ${r.explain ? `<p class="where" style="margin:6px 0">${esc(r.explain.detail)}</p>` : r.rule_hits?.length ? `<div>計算で再現できたミス：${r.rule_hits.map(h => esc(h.ja)).join("、")}</div>` : ""}
      <div>生徒の答え ${esc(r.answer)} ／ 正答 ${esc(r.correct || "（未入力）")}</div>
      <p style="margin:8px 0 0"><b>声かけ・指導のヒント</b><br>${esc(r.advice)}</p>
      ${r.untranslated ? `<p class="sub">一部の誤概念は日本語訳を取得できず、英語のまま表示しています。</p>` : ""}</div>`).join("") || '<div class="empty">指導が必要な誤りはありません</div>'}
    <div class="row"><button class="btn ghost" id="again">別の答案を診断する</button></div></section>`;
  $("#again").onclick = () => { S.img = S.items = S.diag = S.rep = null; S.summary = ""; go(0); };
  const retry = $("#retryja");
  if(retry) retry.onclick = async () => {
    retry.disabled = true; retry.textContent = "作り直しています…";
    try { S.rep = await Services.report(S.diag); v3(); }
    catch(err){ fail(retry, "日本語の説明を作り直す", err.message); }
  };
}
function drawCfg(info){
  const m = $("#mode"), msgs = [];
  drawEedi(); drawPass();
  if(CFG.web){
    const needPass = CFG.passcodeRequired && !PASSCODE;
    const ok = CFG.ocrReady && MODEL.status !== "error" && !needPass;
    m.className = "mode " + (ok ? "live" : "warn");
    m.textContent = needPass ? "本番モード：合言葉を入れてください" : ok ? "本番モード：Gemini とチームのモデルで動いています" : "本番モード：設定が足りません";
    msgs.push(CFG.ocrReady ? `読み取り：Gemini（${info.ocr_model || ""}）。`
      : "Gemini のキーが未設定のため、問題と答えは手入力です（Cloudflare の環境変数 GEMINI_API_KEY を設定してください）。");
    msgs.push({
      idle: "チームのモデル：答案を選ぶと読み込みを始めます（初回だけ約45MBをダウンロードし、以後はブラウザに保存されます）。",
      loading: `チームのモデル：読み込み中…${MODEL.progress ? ` ${MODEL.progress}%` : ""}`,
      ready: `チームのモデル：誤概念 ${MODEL.ids?.length.toLocaleString()} 件を読み込み済み${MODEL.meta?.scope === "calc" ? "（計算分野に絞り込み）" : ""}（一致度 ${MODEL.check?.toFixed(3)}）。` +
        ((MODEL.check != null && MODEL.check < .99) || MODEL.mismatch ? "データ作成時とモデルが一致していません。npm run build-data をやり直してください。" : ""),
      error: `チームのモデル：${MODEL.error}`,
    }[MODEL.status]);
    msgs.push("答案の氏名欄は隠してから撮影してください。");
    $("#modehelp").textContent = msgs.join(" ");
    return;
  }
  if(CFG.claude){
    m.className = "mode live";
    m.textContent = "本番モード：Claude が読み取りと診断を行います";
    msgs.push(CFG.images ? "答案の写真はClaudeが読み取ります。" : "この環境では画像をClaudeに送れないため、問題と答えは手入力です。");
    msgs.push("初回だけ、Claudeの利用を許可するか確認が出ます。利用量は、開いている人のClaudeアカウントから使われます。");
    msgs.push("答案の氏名欄は隠してから撮影してください。");
    $("#modehelp").textContent = msgs.join(" ");
    return;
  }
  m.className = "mode demo";
  m.textContent = "デモモード";
  msgs.push(location.protocol === "file:"
    ? "index.html を直接開いているため、サーバーにつながっていません。README の手順で起動し、表示された URL を開いてください。"
    : "サンプル答案はサンプルの応答で、自分の画像は手入力と簡易判定で動きます。画像は外部に送信されません。");
  $("#modehelp").textContent = msgs.join(" ");
}
// 合言葉（Web版で APP_PASSCODE が設定されているとき）
function drawPass(){
  const box = $("#pass");
  if(!CFG.web || !CFG.passcodeRequired){ box.hidden = true; return; }
  box.hidden = false;
  if(PASSCODE){ box.innerHTML = `<p>合言葉は入力済みです。<button class="link" id="passreset" type="button">入れ直す</button></p>`; $("#passreset").onclick = () => { setPasscode(""); drawCfg(HEALTH); }; return; }
  box.innerHTML = `<form id="passform"><label for="passin">合言葉（チームから聞いたもの）</label>
    <div class="row"><input type="password" id="passin" autocomplete="current-password" style="flex:1;min-width:0"><button class="btn" type="submit">確認する</button></div></form>`;
  $("#passform").onsubmit = async e => {
    e.preventDefault();
    const v = $("#passin").value.trim(); if(!v) return;
    setPasscode(v);
    try { await api("/api/check"); drawCfg(HEALTH); }
    catch(err){ drawCfg(HEALTH); const p = document.createElement("p"); p.className = "err"; p.setAttribute("role", "alert"); p.textContent = err.message; $("#pass").appendChild(p); }
  };
}
// Eedi の誤概念リスト（サイト版のみ。server.py 版はサーバーが持っている）
function drawEedi(){
  const box = $("#eedi");
  if(CFG.web || !CFG.claude){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = EEDI.list
    ? `<p>Eediの誤概念リスト：<b>${EEDI.list.length.toLocaleString()} 件を読み込み済み</b>（このブラウザに保存）。<button class="link" id="eediclear" type="button">削除する</button></p>`
    : `<p>Eediの誤概念リストが未読み込みです。チームの <b>misconception_mapping.csv</b> を読み込むと、診断がEediの誤概念に基づくようになります（このブラウザにだけ保存され、ページには含まれません）。</p>
       <label class="btn ghost filebtn">CSVを読み込む<input id="eedifile" type="file" accept=".csv,text/csv" hidden></label>`;
  $("#eediclear")?.addEventListener("click", () => { EEDI.list = null; EEDI.byId = new Map(); try{ localStorage.removeItem(EEDI_KEY); }catch(e){} drawEedi(); });
  $("#eedifile")?.addEventListener("change", async e => {
    const f = e.target.files[0]; if(!f) return;
    try {
      const text = await f.text(); loadEedi(text);
      try { localStorage.setItem(EEDI_KEY, text); } catch(err) { /* 保存できなくても、このページを閉じるまでは使える */ }
      drawEedi();
    } catch(err) {
      const p = document.createElement("p"); p.className = "err"; p.setAttribute("role","alert"); p.textContent = err.message; box.appendChild(p);
    }
  });
}
(async () => {
  // 自分たちのサイト（Cloudflare Pages）なら /api/health が応答する
  try {
    const r = await fetch("api/health", {cache: "no-store"});
    if(r.ok){
      const info = await r.json();
      if(info.ok === true){ HEALTH = info; CFG.web = true; CFG.ocrReady = !!info.ocr_ready; CFG.ocrName = info.ocr_name || "Gemini"; CFG.passcodeRequired = !!info.passcode_required; }
    }
  } catch(e) {}
  // claude.ai のサイトとして開いていれば、Claude を呼べる
  if(!CFG.web && window.claude?.use){
    try {
      const s = await window.claude.use("sample");
      if(s){ SAMPLE = s; CFG.claude = true; const lim = await s.limits().catch(() => null); CFG.images = !!lim?.images; }
    } catch(e) {}
  }
  drawCfg(HEALTH);
  if(S.step === 0) render();   // 状態に合わせてボタンの文言を更新
})();
drawCfg({});
render();
</script>
